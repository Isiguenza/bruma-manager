# Docker Desktop on macOS does NOT support network_mode: host
# Use this override for local development on macOS
# Run with: docker compose -f docker-compose.yml -f docker-compose.override.yml up -d

services:
  api-server:
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - CORS_ORIGIN=*

  nextjs:
    ports:
      - "3000:3000"

  print-server:
    ports:
      - "3003:3001"
